name: riot_racers
description: "Riot Racers - 2D top-down combat racing (Rock n' Roll Racing style) built with Flutter + Flame."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6
  vector_math: ^2.1.4
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne.ttf
    - family: Rubik
      fonts:
        - asset: assets/fonts/RubikBold.ttf
          weight: 700
