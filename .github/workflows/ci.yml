name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check, no Unity license needed: compiles every script against Unity's API.
  compile-check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: Tools/CompileCheck/check.sh

  # Runs the play mode tests inside the real Unity editor (needs the Unity license secrets).
  unity-tests:
    name: Unity play mode tests
    needs: compile-check
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Skip notice
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::Unity tests skipped - add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (see README)."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-tests-
      # Runs the tests through unity-builder: its license activation works with a personal license,
      # while unity-test-runner reported "No valid Unity Editor license found" with Unity 6.
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: RacingGame.EditorTools.CiTests.RunPlayModeTests
          manualExit: true
      - uses: actions/upload-artifact@v4
        if: always() && env.UNITY_LICENSE != ''
        with:
          name: unity-test-results
          path: artifacts

  # Runs after the tests: a personal Unity license can't be activated by two jobs at the same time.
  # Still builds when a test fails, so there is always an APK to try.
  android-build:
    name: Android build
    needs: [compile-check, unity-tests]
    if: always() && needs.compile-check.result == 'success'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Skip notice
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::Android build skipped - add the Unity license secrets (see README)."
      - name: Free disk space (Android image is large)
        if: env.UNITY_LICENSE != ''
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-android-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-android-
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        with:
          targetPlatform: Android
          buildName: RacingGame
          # Sets up URP and the game scene, then builds a 64-bit (IL2CPP, ARM64) APK.
          buildMethod: RacingGame.EditorTools.BuildScript.BuildAndroid
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: RacingGame-Android-apk
          path: build/Android
