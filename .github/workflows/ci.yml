name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Check plugin methods called through JNI survived the build
        run: |
          DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          mkdir -p apkdex && unzip -o -q build/app/outputs/flutter-apk/app-release.apk 'classes*.dex' -d apkdex
          for f in apkdex/classes*.dex; do "$DEXDUMP" "$f"; done > dex.txt
          awk '/Class descriptor/ {inside = index($0, "sharedpreferences/SharedPreferencesApiRegistrar;") > 0}
               inside && /name +: .getAll./ {found = 1} END {exit found ? 0 : 1}' dex.txt \
            || { echo "::error::SharedPreferencesApiRegistrar.getAll is missing from the APK (stripped by R8?)"; exit 1; }
          echo "OK: SharedPreferencesApiRegistrar.getAll is in the APK"
      - uses: actions/upload-artifact@v4
        with:
          name: RiotRacers-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Web build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: RiotRacers-web
          path: build/web

  pages:
    name: Publish web game (GitHub Pages)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/flutter-flame'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --base-href /${{ github.event.repository.name }}/
      - run: touch build/web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
